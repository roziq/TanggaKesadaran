name: Update soal

on:
  schedule:
    - cron: "0 20 * * 0"   # tiap Minggu 20:00 UTC (Senin 03:00 WIB)
  workflow_dispatch:        # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate soal baru
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_soal.py
      - name: Commit jika ada perubahan
        run: |
          if git diff --quiet -- soal.json; then echo "Tidak ada perubahan"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soal.json
          git commit -m "Tambah soal baru otomatis"
          git push
